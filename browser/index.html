<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; worker-src blob:; frame-src blob:; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Planorama · local plan generator</title>
<style>
body { font: 16px system-ui, sans-serif; margin: 2rem auto; padding: 0 1rem; max-width: 80rem; color: #182b42; background: #f8fafc }
form { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center }
button, select, input { font: inherit }
iframe { width: 100%; height: 65vh; border: 1px solid #cbd5e1; background: white; margin-top: 1rem }
a { margin-right: 1rem }
</style>
<h1>Planorama</h1>
<p>Select one saved plan from <code>terraform show -json</code> (up to 32 MiB). Generation stays in this browser. Files and results are not uploaded or automatically saved.</p>
<form id="generate-form">
  <label>Plan JSON <input id="file" type="file" accept=".json,application/json" required></label>
  <label>Output <select id="format"><option value="svg">SVG</option><option value="html">HTML</option></select></label>
  <label><input id="changed" type="checkbox"> Changed only</label>
  <button id="generate" disabled>Generate</button>
  <button id="cancel" type="button" disabled>Cancel</button>
</form>
<p id="status" role="status">Loading local generator…</p>
<a id="download" hidden>Download</a>
<iframe id="preview" title="Generated diagram" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<script src="app.js" defer></script>
</html>
