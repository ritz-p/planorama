<text x="174" y="12" font-weight="700">Directed Association</text>
<text x="174" y="30">Dashed line from a Route to its</text>
<text x="174" y="48">next hop. The destination arrow</text>
<text x="174" y="66">expresses direction; matching</text>
<text x="174" y="84">badges identify the same</text>
<text x="174" y="102">relationship.</text>
</g>
<g data-legend-entry="connection" transform="translate(492 238)">
