<g id="relationship-legend" font-size="12" fill="#475569" transform="translate(40 148)"><rect width="1040" height="328" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="16" y="29" font-size="15" font-weight="700" fill="#334155">Relationship lines</text>
<text x="16" y="56">Line color shows the relationship&apos;s own Terraform action, independently of endpoint-card actions.</text>
<path data-legend-action="none" d="M 16 77 H 42" fill="none" stroke="#94a3b8" stroke-width="1.5"/><text x="50" y="82">no independent change</text>
<path data-legend-action="unchanged" d="M 234 77 H 260" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="268" y="82">unchanged</text>
<text x="16" y="110">no independent change: no separate Terraform action is identified. unchanged: an explicit no-op action.</text>
<path data-legend-kind="dependency" data-directionality="directed" d="M 16 139 H 60" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="80" y="144" font-weight="700">Dependency</text>
<text x="80" y="162">Thin solid arrow from the referenced resource to the dependent resource; not exact Terraform execution order.</text>
<path data-legend-kind="association" data-directionality="undirected" d="M 16 187 H 60" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 4"/>
<text x="80" y="192" font-weight="700">Association</text>
<text x="80" y="210">Dashed and usually undirected. A route next-hop association is directed from the route to its target.</text>
<path data-legend-kind="connection" data-directionality="undirected" d="M 16 235 H 60" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="0 3.5" stroke-linecap="round"/>
<text x="80" y="240" font-weight="700">Connection</text>
<text x="80" y="258">Thicker dots show an inferred, undirected connection; this does not guarantee actual network reachability.</text>
<g data-legend-kind="containment" fill="none" stroke="#94a3b8"><rect x="16" y="278" width="44" height="28" rx="4"/><rect x="25" y="288" width="26" height="12" rx="2"/></g>
<text x="80" y="288" font-weight="700">Containment</text>
<text x="80" y="306">Nested boxes show containment; nesting replaces a redundant relationship line.</text>
</g>
