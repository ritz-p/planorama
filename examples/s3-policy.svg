<text x="174" y="12" font-weight="700">Connection</text>
<text x="174" y="30">Thicker dotted line shows an</text>
<text x="174" y="48">inferred, undirected connection;</text>
<text x="174" y="66">this does not guarantee actual</text>
<text x="174" y="84">network reachability.</text>
</g>
<g data-legend-entry="containment" transform="translate(0 362)">
