<text x="174" y="12" font-weight="700">Connection</text>
<text x="174" y="30">Thicker dotted line shows an</text>
<text x="174" y="48">inferred, undirected connection;</text>
<text x="174" y="66">this does not guarantee actual</text>
<text x="174" y="84">network reachability.</text>
</g>
<g data-legend-entry="containment" transform="translate(0 362)">
<g data-legend-sample="containment">
<g data-legend-kind="containment" fill="none" stroke="#94a3b8"><rect x="65" y="2" width="44" height="28" rx="4"/><rect x="74" y="12" width="26" height="12" rx="2"/></g>
</g>
<text x="174" y="12" font-weight="700">Containment</text>
<text x="174" y="30">Nested boxes show containment;</text>
<text x="174" y="48">nesting replaces a redundant</text>
<text x="174" y="66">relationship line.</text>
</g>
<text x="16" y="462">Hollow circles mark resource/card attachment points; neither end of an undirected line is a directional start.</text>
<text x="16" y="480">Filled internal dots mark bundle junctions.</text>
<text x="16" y="506">Matching [N] badges identify the same Terraform-backed relationship and its Relationship Resources entry. They do</text>
<text x="16" y="524">not express direction or count connections. Reference-only Connections and Dependencies have no number.</text>
</g>
