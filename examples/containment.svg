<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1366" viewBox="0 0 1100 1366" role="img" aria-labelledby="title description">
<title id="title">Terraform plan</title>
<desc id="description">3 resources (3 cards), 3 relationships. Lines show architectural relationships. Edge titles identify the relationship kind and Terraform change. Thin solid: dependency. Dashed: association. Thick dotted: connection. Nested boxes: containment. Edge color preserves the Terraform action when available. Service label backgrounds: orange = compute; green = storage; blue = network; red = IAM; gray = unclassified. Spatial card role marks: rounded rectangle = execution; cylinder = data store; hexagon = network.</desc>
