<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 645 242" width="645" height="242" role="img" aria-labelledby="title desc">
<title id="title">Final route comparison for the synthetic one-obstacle case</title>
<desc id="desc">Each panel uses the same scale, terminals and square obstacle. The bounded selector removes two bends and adds 96 pixels to the final route.</desc>
<rect width="645" height="242" fill="white"/>
<g font-family="sans-serif" fill="#192737">
<g transform="translate(12 12)">
  <text x="8" y="20" font-size="15" font-weight="bold">Original route</text>
  <text x="8" y="41" font-size="13">5 bends · 288 px</text>
  <g transform="translate(-8 43) scale(1.5)">
    <rect x="104" y="56" width="16" height="16" fill="#d8dee8" stroke="#586980"/>
    <path d="M 112 112 L 120 112 Q 128 112 128 104 L 128 24 Q 128 16 120 16 L 88 16 Q 80 16 80 24 L 80 56 Q 80 64 72 64 L 40 64 Q 32 64 32 72 L 32 96" fill="none" stroke="#165287" stroke-width="2.5"/>
    <circle cx="112" cy="112" r="3" fill="#165287"/><circle cx="32" cy="96" r="3" fill="#165287"/>
  </g>
</g>
<g transform="translate(222 12)">
  <text x="8" y="20" font-size="15" font-weight="bold">First improvement</text>
  <text x="8" y="41" font-size="13">5 bends · 192 px</text>
  <g transform="translate(-8 43) scale(1.5)">
    <rect x="104" y="56" width="16" height="16" fill="#d8dee8" stroke="#586980"/>
    <path d="M 112 112 L 120 112 Q 128 112 128 104 L 128 96 Q 128 88 120 88 L 88 88 Q 80 88 80 80 L 80 72 Q 80 64 72 64 L 40 64 Q 32 64 32 72 L 32 96" fill="none" stroke="#165287" stroke-width="2.5"/>
    <circle cx="112" cy="112" r="3" fill="#165287"/><circle cx="32" cy="96" r="3" fill="#165287"/>
  </g>
</g>
<g transform="translate(432 12)">
  <text x="8" y="20" font-size="15" font-weight="bold">Bounded selection</text>
  <text x="8" y="41" font-size="13">3 bends · 288 px</text>
  <g transform="translate(-8 43) scale(1.5)">
    <rect x="104" y="56" width="16" height="16" fill="#d8dee8" stroke="#586980"/>
    <path d="M 112 112 L 120 112 Q 128 112 128 104 L 128 24 Q 128 16 120 16 L 40 16 Q 32 16 32 24 L 32 96" fill="none" stroke="#165287" stroke-width="2.5"/>
    <circle cx="112" cy="112" r="3" fill="#165287"/><circle cx="32" cy="96" r="3" fill="#165287"/>
  </g>
</g>
</g></svg>
