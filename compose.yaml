services:
  dev:
    build: .
    working_dir: /workspace
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
  terraform-example:
    image: hashicorp/terraform:1.9.8
    profiles: [examples]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/examples/terraform/plan.sh"]
    volumes:
      - .:/workspace
volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
