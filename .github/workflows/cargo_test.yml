name: Cargo test
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request && inputs.expected_head_sha
      && format('Validate PR #{0} at {1}', inputs.pull_request, inputs.expected_head_sha)
      || github.event.pull_request.title || github.workflow }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - assets/**
      - tests/fixtures/**
      - examples/**
      - .github/workflows/cargo_test.yml
      - .github/scripts/checkout-validation.sh
      - .github/scripts/test-suites.cjs
  pull_request:
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - assets/**
      - tests/fixtures/**
      - examples/**
      - .github/workflows/cargo_test.yml
      - .github/scripts/checkout-validation.sh
      - .github/scripts/test-suites.cjs
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to validate with its base (requires expected_head_sha)'
        type: string
        required: false
      expected_head_sha:
        description: 'Exact PR head SHA that must match this workflow run'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    cargo-test-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  test-suites:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Dispatched Test suite' || 'Test suite' }} (${{ matrix.suite }})
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [standard, large]
    env:
      TEST_SUITE: ${{ matrix.suite }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/local/bin/planorama-native-linker
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
      SCCACHE_DIR: ${{ runner.temp }}/sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Checkout dispatched PR merge
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: bash .github/scripts/checkout-validation.sh
      - name: Install pinned toolchain
        run: rustc --version --verbose
      - name: Install native linker
        run: |
          sudo sh scripts/install-mold.sh
          sudo install -m 755 scripts/native-linker.sh /usr/local/bin/planorama-native-linker
      - name: Install compiler cache
        run: sudo sh scripts/install-sccache.sh
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-0.10.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', '.cargo/**', 'build.rs', 'assets/**', 'scripts/install-sccache.sh', 'scripts/native-linker.sh', '.github/workflows/cargo_test.yml') }}-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-0.10.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', '.cargo/**', 'build.rs', 'assets/**', 'scripts/install-sccache.sh', 'scripts/native-linker.sh', '.github/workflows/cargo_test.yml') }}-
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v2-mold-2.40.4
          shared-key: ${{ hashFiles('build.rs', 'assets/**', 'scripts/install-mold.sh', 'scripts/native-linker.sh') }}-tests
          cache-workspace-crates: 'false'
      - name: Start compiler cache
        id: compiler-start
        run: |
          sccache --start-server
          sccache --zero-stats
      - name: Compile tests
        run: node .github/scripts/test-suites.cjs "$TEST_SUITE" compile
      - name: Run tests
        run: node .github/scripts/test-suites.cjs "$TEST_SUITE" run
      - name: Compiler cache statistics
        id: compiler-statistics
        if: always() && steps.compiler-start.outcome == 'success'
        run: |
          sccache --show-stats
          node .github/scripts/compiler-cache.cjs
          sccache --stop-server
      - name: Save new compiler entries
        if: success() && steps.compiler-statistics.outputs.save == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  tests:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Dispatched Tests' || 'Tests' }}
    needs: [test-suites]
    if: >-
      ${{ !cancelled()
          && (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check test suites
        env:
          SUITES_RESULT: ${{ needs.test-suites.result }}
        run: test "$SUITES_RESULT" = success
