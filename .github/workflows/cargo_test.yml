name: Cargo test
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request && inputs.expected_head_sha
      && format('Validate PR #{0} at {1}', inputs.pull_request, inputs.expected_head_sha)
      || github.event.pull_request.title || github.workflow }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - assets/**
      - tests/fixtures/**
      - examples/**
      - .github/workflows/cargo_test.yml
      - .github/scripts/checkout-validation.sh
      - .github/scripts/test-suites.cjs
  pull_request:
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - assets/**
      - tests/fixtures/**
      - examples/**
      - .github/workflows/cargo_test.yml
      - .github/scripts/checkout-validation.sh
      - .github/scripts/test-suites.cjs
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to validate with its base (requires expected_head_sha)'
        type: string
        required: false
      expected_head_sha:
        description: 'Exact PR head SHA that must match this workflow run'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    cargo-test-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  test-suites:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Dispatched Test suite' || 'Test suite' }} (${{ matrix.suite }})
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [standard, large]
    env:
      TEST_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Checkout dispatched PR merge
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: bash .github/scripts/checkout-validation.sh
      - name: Install pinned toolchain
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-rust-dependencies
          shared-key: ${{ hashFiles('build.rs', 'assets/**') }}-tests
          cache-workspace-crates: 'false'
      - name: Compile tests
        run: node .github/scripts/test-suites.cjs "$TEST_SUITE" compile
      - name: Run tests
        run: node .github/scripts/test-suites.cjs "$TEST_SUITE" run
      - name: Calibrate spacing budgets
        if: matrix.suite == 'standard'
        env:
          PLANORAMA_SPACING_REPORT_DIR: output/spacing-calibration
        run: cargo test --locked --bin planorama budget_calibration -- --ignored --nocapture
      - name: Upload spacing comparison
        if: matrix.suite == 'standard'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: spacing-calibration
          path: output/spacing-calibration
          if-no-files-found: error

  tests:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Dispatched Tests' || 'Tests' }}
    needs: [test-suites]
    if: >-
      ${{ !cancelled()
          && (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check test suites
        env:
          SUITES_RESULT: ${{ needs.test-suites.result }}
        run: test "$SUITES_RESULT" = success
