name: PR timing report
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Measure recent PR validations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-budget.cjs > pr-timings.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pr-timings
          path: pr-timings.json
