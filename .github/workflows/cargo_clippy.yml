name: Cargo clippy

on:
  push:
    branches: [main]
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - assets/**
      - tests/fixtures/**
      - examples/**
      - .github/workflows/cargo_clippy.yml
  pull_request:
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - assets/**
      - tests/fixtures/**
      - examples/**
      - .github/workflows/cargo_clippy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-rust-dependencies
          key: ${{ hashFiles('build.rs', 'assets/**') }}
          cache-workspace-crates: 'false'
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
