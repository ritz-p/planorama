name: Cargo clippy

on:
  pull_request:
    paths:
      - '**.rs'
      - .github/workflows/cargo_clippy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose run --build --rm -T dev cargo clippy --locked --all-targets --all-features -- -D warnings
