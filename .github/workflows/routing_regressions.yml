name: Routing regressions
run-name: Routing regressions at ${{ github.sha }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    name: Deferred routing regressions
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-rust-dependencies
          shared-key: ${{ hashFiles('build.rs', 'assets/**') }}-tests
          cache-workspace-crates: 'false'
      - name: Compile regressions
        run: cargo test --locked --all-features --bin planorama --no-run
      - name: Run regressions
        run: |
          set -o pipefail
          cargo test --locked --all-features --bin planorama deferred_regression_ -- --ignored --test-threads=2 --nocapture 2>&1 | tee routing-regressions.log
      - name: Upload regression log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: routing-regressions-${{ github.sha }}
          path: routing-regressions.log
          if-no-files-found: warn
          retention-days: 14
