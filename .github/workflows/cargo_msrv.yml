name: Cargo msrv
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request && inputs.expected_head_sha
      && format('Validate PR #{0} at {1}', inputs.pull_request, inputs.expected_head_sha)
      || github.event.pull_request.title || github.workflow }}

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .github/workflows/cargo_msrv.yml
      - .github/scripts/checkout-validation.sh
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to validate with its base (requires expected_head_sha)'
        type: string
        required: false
      expected_head_sha:
        description: 'Exact PR head SHA that must match this workflow run'
        type: string
        required: false

env:
  RUST_VERSION: 1.85.0

permissions:
  contents: read
  pull-requests: read

jobs:
  msrv:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Dispatched MSRV' || 'MSRV' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Checkout dispatched PR merge
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: bash .github/scripts/checkout-validation.sh
      - name: Build MSRV image
        run: docker build --build-arg RUST_VERSION=${{ env.RUST_VERSION }} --tag planorama-msrv .
      - name: Run MSRV tests
        run: docker run --rm --volume "$PWD:/workspace" --env CARGO_TARGET_DIR=/tmp/planorama-target planorama-msrv cargo +${{ env.RUST_VERSION }}  test --locked --all-targets --all-features
