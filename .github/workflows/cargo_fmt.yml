name: Cargo fmt

on:
  pull_request:
    paths:
      - '**.rs'
      - rust-toolchain.toml
      - .github/workflows/cargo_fmt.yml
      - .github/scripts/checkout-validation.sh
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to validate with its base (requires expected_head_sha)'
        type: string
        required: false
      expected_head_sha:
        description: 'Exact PR head SHA that must match this workflow run'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Checkout dispatched PR merge
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: bash .github/scripts/checkout-validation.sh
      - name: Install pinned toolchain
        run: rustc --version --verbose
      - run: cargo fmt --all --check
