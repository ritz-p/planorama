name: Browser Wasm
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.yaml:compose.wasm-ci.yaml
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cache identity
        id: identity
        env:
          CONFIG: ${{ hashFiles('Dockerfile', 'compose*.yaml', 'rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', '.cargo/**', 'build.rs', 'assets/**', 'scripts/**', '.github/workflows/wasm.yml') }}
        run: echo "key=wasm-ci-v1-${{ runner.os }}-${{ runner.arch }}-$CONFIG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned environment
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: planorama-wasm-ci:local
          cache-from: type=gha,scope=browser-wasm
          cache-to: type=gha,scope=browser-wasm,mode=max
      - name: Restore registry
        id: registry
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .wasm-ci/registry
            .wasm-ci/git
          key: ${{ steps.identity.outputs.key }}-registry-${{ github.sha }}
          restore-keys: ${{ steps.identity.outputs.key }}-registry-
      - name: Restore default-native
        id: default-native
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .wasm-ci/target/default/release
          key: ${{ steps.identity.outputs.key }}-default-native-${{ github.sha }}
          restore-keys: ${{ steps.identity.outputs.key }}-default-native-
      - name: Restore default-wasm
        id: default-wasm
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .wasm-ci/target/default/wasm32-unknown-unknown/release
          key: ${{ steps.identity.outputs.key }}-default-wasm-${{ github.sha }}
          restore-keys: ${{ steps.identity.outputs.key }}-default-wasm-
      - name: Restore standalone-native
        id: standalone-native
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .wasm-ci/target/standalone/release
            .wasm-ci/target/standalone/debug
          key: ${{ steps.identity.outputs.key }}-standalone-native-${{ github.sha }}
          restore-keys: ${{ steps.identity.outputs.key }}-standalone-native-
      - name: Restore standalone-wasm
        id: standalone-wasm
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .wasm-ci/target/standalone/wasm32-unknown-unknown/release
          key: ${{ steps.identity.outputs.key }}-standalone-wasm-${{ github.sha }}
          restore-keys: ${{ steps.identity.outputs.key }}-standalone-wasm-
      - name: Start environment
        run: |
          mkdir -p .wasm-ci/registry .wasm-ci/git .wasm-ci/target
          docker compose up -d --no-build dev
          docker compose exec -T dev sccache --zero-stats
      - name: Verify native reference cache
        run: docker compose exec -T dev node --test tests/support/native-reference.test.cjs
      - name: Build and verify both distributions
        run: docker compose exec -T dev sh scripts/wasm-ci.sh
      - name: Prepare dependency caches
        run: |
          docker compose exec -T dev sh -c 'find /workspace/target -depth -name "*planorama*" -exec rm -rf {} +'
          sudo chown -R "$(id -u):$(id -g)" .wasm-ci
      - name: Save registry
        if: success() && steps.registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .wasm-ci/registry
            .wasm-ci/git
          key: ${{ steps.registry.outputs.cache-primary-key }}
      - name: Save default-native
        if: success() && steps.default-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .wasm-ci/target/default/release
          key: ${{ steps.default-native.outputs.cache-primary-key }}
      - name: Save default-wasm
        if: success() && steps.default-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .wasm-ci/target/default/wasm32-unknown-unknown/release
          key: ${{ steps.default-wasm.outputs.cache-primary-key }}
      - name: Save standalone-native
        if: success() && steps.standalone-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .wasm-ci/target/standalone/release
            .wasm-ci/target/standalone/debug
          key: ${{ steps.standalone-native.outputs.cache-primary-key }}
      - name: Save standalone-wasm
        if: success() && steps.standalone-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .wasm-ci/target/standalone/wasm32-unknown-unknown/release
          key: ${{ steps.standalone-wasm.outputs.cache-primary-key }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: output/wasm-ci
          retention-days: 7
