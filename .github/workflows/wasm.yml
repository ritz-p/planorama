name: Browser Wasm
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose*.yaml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - build.rs
      - assets/**
      - scripts/**
      - .github/workflows/wasm.yml
  workflow_dispatch:
    inputs:
      full_library:
        description: 'Run the complete no-default-feature library suite for comparison'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: wasm-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.yaml:compose.wasm-ci.yaml
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cache identity
        id: identity
        env:
          CONFIG: ${{ hashFiles('Dockerfile', '.dockerignore', 'compose*.yaml', 'rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', '.cargo/**', 'build.rs', 'assets/**', 'scripts/**', '.github/workflows/wasm.yml') }}
        run: echo "key=wasm-ci-v2-${{ runner.os }}-${{ runner.arch }}-$CONFIG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned environment
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: planorama-wasm-ci:local
          cache-from: type=gha,scope=browser-wasm
          cache-to: type=gha,scope=browser-wasm,mode=max
      - name: Restore registry
        id: registry
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .wasm-ci/registry
            .wasm-ci/git
          key: ${{ steps.identity.outputs.key }}-registry
      - name: Restore native
        id: native
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .wasm-ci/target/shared/release
            .wasm-ci/target/shared/debug
          key: ${{ steps.identity.outputs.key }}-native
      - name: Restore wasm
        id: wasm
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .wasm-ci/target/shared/wasm32-unknown-unknown/release
          key: ${{ steps.identity.outputs.key }}-wasm
      - name: Start environment
        run: |
          mkdir -p .wasm-ci/registry .wasm-ci/git .wasm-ci/target
          docker compose up -d --no-build dev
          docker compose exec -T dev sccache --zero-stats
      - name: Verify native reference cache
        run: docker compose exec -T dev node --test tests/support/native-reference.test.cjs
      - name: Build and verify both distributions
        env:
          WASM_CI_FULL_LIB: ${{ inputs.full_library && '1' || '0' }}
        run: docker compose exec -T -e WASM_CI_FULL_LIB dev sh scripts/wasm-ci.sh
      - name: Prepare dependency caches
        run: |
          docker compose exec -T dev sh -c 'find /workspace/target -depth \( -name "*planorama*" -o -name "cli-*" \) -exec rm -rf {} +'
          sudo chown -R "$(id -u):$(id -g)" .wasm-ci
      - name: Save registry
        if: success() && steps.registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .wasm-ci/registry
            .wasm-ci/git
          key: ${{ steps.registry.outputs.cache-primary-key }}
      - name: Save native
        if: success() && steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .wasm-ci/target/shared/release
            .wasm-ci/target/shared/debug
          key: ${{ steps.native.outputs.cache-primary-key }}
      - name: Save wasm
        if: success() && steps.wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .wasm-ci/target/shared/wasm32-unknown-unknown/release
          key: ${{ steps.wasm.outputs.cache-primary-key }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: output/wasm-ci
          retention-days: 7
