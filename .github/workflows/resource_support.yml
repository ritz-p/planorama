name: Resource support

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/unit/resource_support*'
      - 'tests/unit/aws_inventory.rs'
      - 'tests/fixtures/aws-inventory/**'
      - 'tests/support/aws-inventory.test.cjs'
      - 'tests/support/aws-inventory-diff.test.cjs'
      - 'scripts/aws-inventory.cjs'
      - 'scripts/aws-inventory-diff.cjs'
      - 'scripts/aws-semantic-audit.cjs'
      - 'tests/support/aws-semantic-audit.test.cjs'
      - 'tests/support/verify-aws-semantic-contracts.cjs'
      - 'docs/aws-semantic-*'
      - 'scripts/prepare-aws-inventory.sh'
      - 'scripts/update-resource-support.sh'
      - 'Cargo.*'
      - 'build.rs'
      - 'assets/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/resource_support.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resource-support:
    name: Resource support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-rust-dependencies
          shared-key: ${{ hashFiles('build.rs', 'assets/**') }}-tests
          cache-workspace-crates: 'false'
      - name: Check resource type discovery
        run: cargo test --locked --lib provider::aws::resource_support::discovers_type_literals_in_rust_expressions_and_macros_only -- --exact
      - name: Check managed inventory and extractor
        run: |
          cargo test --locked --lib provider::aws::basic
          node --test tests/support/aws-inventory.test.cjs
          node --test tests/support/aws-inventory-diff.test.cjs
          node scripts/aws-semantic-audit.cjs --check
          node --test tests/support/aws-semantic-audit.test.cjs
