name: Resource support

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/unit/resource_support*'
      - 'tests/unit/aws_inventory.rs'
      - 'tests/fixtures/aws-inventory/**'
      - 'tests/support/aws-inventory.test.cjs'
      - 'tests/support/aws-inventory-diff.test.cjs'
      - 'scripts/*cloudflare*'
      - 'tests/support/cloudflare-*.test.cjs'
      - 'tests/fixtures/cloudflare-*'
      - 'tests/unit/cloudflare*'
      - 'tests/fixtures/cloudflare-inventory/**'
      - 'tests/fixtures/cloudflare-captured/**'
      - 'scripts/aws-inventory.cjs'
      - 'scripts/aws-inventory-diff.cjs'
      - 'scripts/provider-schema-diff.cjs'
      - 'scripts/aws-semantic-audit.cjs'
      - 'scripts/dms-fixtures.cjs'
      - 'tests/fixtures/dms-*'
      - 'tests/support/aws-semantic-audit.test.cjs'
      - 'tests/support/verify-aws-semantic-contracts.cjs'
      - 'docs/aws-semantic-*'
      - 'scripts/prepare-aws-inventory.sh'
      - 'scripts/update-resource-support.sh'
      - 'Cargo.*'
      - 'build.rs'
      - 'assets/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/resource_support.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resource-support:
    name: Resource support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-rust-dependencies
          shared-key: ${{ hashFiles('build.rs', 'assets/**') }}-tests
          cache-workspace-crates: 'false'
      - name: Build resource support tests
        run: |
          cargo test --locked --lib --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/resource-support-cargo.jsonl"
          node - "$RUNNER_TEMP/resource-support-cargo.jsonl" <<'JS'
          const fs = require('node:fs');
          const messages = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n').map(line => JSON.parse(line));
          const tests = messages.filter(message =>
            message.reason === 'compiler-artifact' && message.profile.test &&
            message.executable);
          if (tests.length !== 1 || !fs.existsSync(tests[0].executable)) {
            throw new Error('Expected one Cargo library test executable');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'RESOURCE_SUPPORT_TEST_BINARY=' + tests[0].executable + '\n');
          JS
      - name: Check resource type discovery
        run: '"$RESOURCE_SUPPORT_TEST_BINARY" provider::aws::resource_support::discovers_type_literals_in_rust_expressions_and_macros_only --exact'
      - name: Check AWS basic inventory
        run: '"$RESOURCE_SUPPORT_TEST_BINARY" provider::aws::basic'
      - name: Check AWS inventory and semantic evidence
        run: |
          node --test tests/support/aws-inventory.test.cjs
          node --test tests/support/aws-inventory-diff.test.cjs
          node scripts/aws-semantic-audit.cjs --check
          node scripts/dms-fixtures.cjs --check
          node --test tests/support/aws-semantic-audit.test.cjs
      - name: Check Cloudflare Rust contracts
        run: '"$RESOURCE_SUPPORT_TEST_BINARY" provider::cloudflare'
      - name: Check Cloudflare fixtures and captures
        run: |
          node --test tests/support/cloudflare-*.test.cjs
          node scripts/cloudflare-fixtures.cjs --check
          node scripts/cloudflare-capture.cjs check
      - name: Generate and compare Cloudflare catalog
        run: |
          RESOURCE_SUPPORT_FILTER=cloudflare_ "$RESOURCE_SUPPORT_TEST_BINARY" provider::aws::resource_support::export_resource_support --ignored --exact
          node scripts/update-cloudflare-types.cjs
          cargo fmt --all --check
          git diff --exit-code -- src/provider/cloudflare/types.rs
