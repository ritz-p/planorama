name: Terraform compatibility

on:
  pull_request:
    paths:
      - tests/fixtures/compatibility/**
      - scripts/terraform-compatibility.cjs
      - scripts/terraform-compatibility-inputs.cjs
      - scripts/compatibility-provider.cjs
      - tests/ci/compatibility-provider.test.cjs
      - tests/ci/terraform-compatibility.test.cjs
      - tests/fixtures/aws-captured/**
      - tests/fixtures/aws-region-overrides/**
      - examples/terraform/**
      - .github/workflows/terraform_compatibility.yml
      - src/plan/evidence.rs
      - src/plan/evidence/**
      - src/cli/provider_plan.rs
      - tests/unit/plan/evidence.rs
      - tests/integration/provider_plan.rs
      - tests/fixtures/provider-plan/**
      - tests/support/provider_plan.cjs
      - tests/support/verify_provider_plan.sh
      - tests/support/sts_fixture.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up -d --build dev
      - run: docker compose exec -T dev node tests/support/provider_plan.cjs prepare
      - run: docker compose exec -T dev cargo build --locked --bin planorama
      - name: Verify real saved plans without external network
        run: >-
          docker run --rm --network none
          --volumes-from "$(docker compose ps -q dev)"
          planorama-dev node tests/support/provider_plan.cjs verify
  committed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/terraform-compatibility.cjs check
      - run: node --test tests/ci/terraform-compatibility.test.cjs
      - run: node --test tests/ci/compatibility-provider.test.cjs
  capture:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up -d --build dev
      - run: docker compose exec -T dev node scripts/terraform-compatibility.cjs prepare
      - run: >-
          docker run --rm --network none
          --mount type=bind,source="$PWD",target=/workspace
          planorama-dev node scripts/terraform-compatibility.cjs capture
      - run: docker compose exec -T dev node scripts/terraform-compatibility.cjs check
      - run: docker compose exec -T dev cargo test --locked --lib compatibility_tests
      - run: docker compose exec -T dev cargo test --locked --test terraform_plan
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: terraform-compatibility
          path: tests/fixtures/compatibility
          include-hidden-files: true
