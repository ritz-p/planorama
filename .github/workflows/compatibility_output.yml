name: Compatibility output

on:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  output:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up -d --build dev
      - run: docker compose exec -T dev cargo build --locked --bin planorama
      - run: docker compose exec -T dev node scripts/terraform-compatibility.cjs check
      - run: docker compose exec -T dev node scripts/compatibility-output.cjs
      - run: docker compose exec -T dev node tests/support/provider_plan.cjs prepare
      - name: Verify saved-plan evidence without external network
        run: >-
          docker run --rm --network none
          --volumes-from "$(docker compose ps -q dev)"
          planorama-dev node tests/support/provider_plan.cjs verify
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: compatibility-output-${{ github.sha }}
          path: output/compatibility-output
