name: Compatibility output

on:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  output:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --locked --bin planorama
      - run: node scripts/terraform-compatibility.cjs check
      - run: node scripts/compatibility-output.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: compatibility-output-${{ github.sha }}
          path: output/compatibility-output
