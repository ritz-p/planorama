[package]
name = "planorama"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85"
autotests = false

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

[[test]]
name = "cli"
path = "tests/integration/cli.rs"

[[test]]
name = "terraform_plan"
path = "tests/integration/terraform_plan.rs"

[[test]]
name = "rendering"
path = "tests/integration/rendering.rs"

[dependencies]
hcl-rs = "0.19.8"
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
tempfile = "3"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[build-dependencies]
roxmltree = "0.21.1"

[dev-dependencies]
roxmltree = "0.21.1"

[[test]]
name = "large_example"
path = "tests/integration/large_example.rs"
